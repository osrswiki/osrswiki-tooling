[workspace]
name = "osrs-tools"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "==3.9.23"
numpy = "==2.0.2"
pillow = "==11.3.0"
libsqlite = "==3.53.3"
libzlib = "==1.3.2"
libpng = "==1.6.58"
libjpeg-turbo = "==3.2.0"
jsonschema = "==4.25.1"
requests = "==2.32.5"
google-api-python-client = "==2.179.0"
google-auth = "==2.40.3"

[tasks]
assets = "python $PIXI_PROJECT_ROOT/asset-updater.py --all"
map-assets = "python $PIXI_PROJECT_ROOT/map/map-asset-generator.py"
check = "PYTHONDONTWRITEBYTECODE=1 python -c \"import google.oauth2.service_account, googleapiclient.discovery, numpy, requests; from PIL import Image; print('OSRS dependencies import ok')\""
non-surface-tests = "PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s map/tests -p 'test_osrs_*.py'"
